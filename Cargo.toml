[package]
name = "openworkers-runner"
version = "0.14.7"
edition = "2024"
license = "MIT"
default-run = "openworkers-runner"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
default = ["database"]

# Runtime backends, exactly one per build
v8 = ["dep:openworkers-runtime-v8", "_js"]
jsc = ["dep:openworkers-runtime-jsc", "_js"]
quickjs = ["dep:openworkers-runtime-quickjs", "_js"]
boa = ["dep:openworkers-runtime-boa", "_js"]
wasm = ["dep:openworkers-runtime-wasm", "openworkers-core/wasm"]

# Internal: the guest is JavaScript, so its sources need transpiling and lowering
_js = ["dep:openworkers-transform"]

# Optional on v8, ignored by every other backend
multiplexing = ["openworkers-runtime-v8?/multiplexing"]

database = ["dep:postgate"]
telemetry = [
    "dep:opentelemetry",
    "dep:opentelemetry-otlp",
    "dep:opentelemetry_sdk",
    "dep:tracing-opentelemetry",
    "dep:opentelemetry-appender-tracing",
    "dep:tonic",
]

[dependencies]
# HTTP server (hyper)
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
bytes = "1.11.0"
log = "0.4.29"
tokio = "1.49.0"
tokio-util = { version = "0.7", features = ["rt"] }
once_cell = "1.19"
# filetime = "0.2"  # was used by disk-based snapshot cache
env_logger = "0.11.6"
lru = "0.16.3"

# Tracing (always available)
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# OpenTelemetry (optional, via telemetry feature)
opentelemetry = { version = "0.31", optional = true }
opentelemetry-otlp = { version = "0.31", features = ["grpc-tonic", "tls-roots"], optional = true }
tonic = { version = "0.14", optional = true }
opentelemetry_sdk = { version = "0.31", features = ["rt-tokio"], optional = true }
tracing-opentelemetry = { version = "0.32", optional = true }
opentelemetry-appender-tracing = { version = "0.31", features = ["experimental_use_tracing_span_context"], optional = true }
sqlx = { version = "0.8.6", features = [ "runtime-tokio", "postgres", "uuid", "bigdecimal", "rust_decimal", "tls-rustls" ] }
reqwest = { version = "0.13.1", default-features = false, features = ["rustls", "json", "stream"] }
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-webpki-roots"] }
rustls = { version = "0.23", features = ["ring"] }

# Core types
openworkers-core = { git = "https://github.com/openworkers/openworkers-core", tag = "v0.14.0", features = ["hyper"] }

# Transform (TS strip + export default -> globalThis.default)
openworkers-transform = { git = "https://github.com/openworkers/openworkers-transform", tag = "v0.1.0", optional = true }

# Runtime backends
openworkers-runtime-v8 = { path = "../openworkers-runtime-v8", optional = true, features = ["ptrcomp"] }
openworkers-runtime-jsc = { path = "../openworkers-runtime-jsc", optional = true }
openworkers-runtime-quickjs = { path = "../openworkers-runtime-quickjs", optional = true }
openworkers-runtime-boa = { path = "../openworkers-runtime-boa", optional = true }
openworkers-runtime-wasm = { path = "../openworkers-runtime-wasm", optional = true }
# nova is absent on purpose: it wires no OperationsHandler, and nova_vm 1.0 pulls
# temporal_rs 0.1.2, which does not build against the icu 2.2 that v8 152 forces

# Database bindings (optional)
# postgate = { path = "../postgate", default-features = false, optional = true }
postgate = { git = "https://github.com/openworkers/postgate", tag = "v0.1.7", default-features = false, optional = true }

async-nats = "0.46.0"
futures = "0.3"
serde_json = "1.0"
serde = { version = "1.0.197", features = ["derive"] }
base64 = "0.22.1"
aws-sigv4 = "1.2"
aws-credential-types = "1.2"
chrono = "0.4.43"
sha2 = "0.10"
hex = "0.4"
uuid = { version = "1.20", features = ["v4"] }
url = "2.5"
dotenvy = "0.15.7"
percent-encoding = "2.3.2"

# https://doc.rust-lang.org/cargo/reference/profiles.html
# https://github.com/johnthagen/min-sized-rust?tab=readme-ov-file#minimizing-rust-binary-size
[profile.release]
strip = true  # Automatically strip symbols from the binary.
opt-level = "z"  # Optimize for size.
incremental = true # Enable incremental compilation.
codegen-units = 1 # Use a single codegen unit to optimize for size.
lto = true # Enable link-time optimization.

[dev-dependencies]
criterion = { version = "0.8.1", features = ["async_tokio"] }
wat = "1.0"
serial_test = "3.2"
# Not every backend pulls the full tokio, but every test harness needs these
tokio = { version = "1.49.0", features = ["macros", "rt", "time"] }

[[bin]]
name = "openworkers-runner"
path = "bin/main.rs"

[[bin]]
name = "snapshot"
path = "bin/snapshot.rs"
required-features = ["v8"]

[[bench]]
name = "worker_benchmark"
harness = false
required-features = ["v8"]

# Runs against whichever JavaScript backend is selected
[[test]]
name = "backend_test"

[[test]]
name = "wasm_tests"
required-features = ["wasm"]

# The rest drive openworkers-runtime-v8 directly
[[test]]
name = "fetch_streaming_test"
required-features = ["v8"]

[[test]]
name = "hyper_integration_test"
required-features = ["v8"]

[[test]]
name = "pinned_pool_test"
required-features = ["v8"]

[[test]]
name = "request_body_streaming_test"
required-features = ["v8"]

[[test]]
name = "sse_streaming_test"
required-features = ["v8"]

[[test]]
name = "stream_cancellation_test"
required-features = ["v8"]

[[test]]
name = "warm_reuse_test"
required-features = ["v8"]

[[test]]
name = "web_api_test"
required-features = ["v8"]

[[test]]
name = "websocket_test"
required-features = ["v8"]

[[test]]
name = "worker_handlers_test"
required-features = ["v8"]

[[test]]
name = "worker_tests"
required-features = ["v8"]

# The 152 alignment is unpublished, and cargo honours a patch only in the root manifest
[patch.crates-io]
openworkers-serde-v8 = { path = "../serde-v8" }
openworkers-glue-v8 = { path = "../glue-v8" }
